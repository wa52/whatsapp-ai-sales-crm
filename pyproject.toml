[project]
name = "whatsapp-ai-sales"
version = "0.1.0"
description = "WhatsApp AI foreign-trade sales assistant + private CRM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.5",
    "litellm>=1.50",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.fastapi]
entrypoint = "src.whatsapp_ai_sales.main:app"
